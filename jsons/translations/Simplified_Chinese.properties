There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = 本模组有五种胜利方式：\n - 魔法胜利：建成本源观测工程，将六件本源装置部件运到首都并组装。\n - 文化胜利：完成五个政策分支，并建成文明大典。\n - 征服胜利：控制所有主要文明的原始首都。\n - 外交胜利：万邦议席开启投票后，赢得外交投票。\n - 时间胜利：到达回合上限时取得最高原生总分。
