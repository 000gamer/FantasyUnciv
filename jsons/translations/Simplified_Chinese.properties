FC Civ Human Empire lore = 以成文律法统合诸城的人类帝国。帝都的每一座建筑，都是各行省效仿的范本。
FC Intro title = FantasyUnciv
FC Intro tagline = 在魔法与钢铁交织的世界，建立你的文明！
FC Intro version = 版本 1.3
FC Intro summary = FantasyUnciv 是 Unciv 的完整奇幻规则模组。建设城市、研究科技、探索遗迹，与城邦结盟，招募英雄，争夺世界的未来。
FC Intro realm header = 建立属于你的国度
FC Intro realm lead = 6个时代、6大种族、12个文明，各有特色。
FC Intro realm text = 统领人类、精灵、矮人、兽人、地精或亡灵，探索魔法世界，建立属于你的国度！
FC Intro sea lead = 海洋精灵还能在海上建城！
FC Intro sea text = 将合适的浅海造礁成岛，再建立新的城市，把文明的疆域延伸到海岸之外。
FC Intro magic header = 让魔法成为国家的力量
FC Intro magic lead = 4个魔法学派：生息、灵魂、元素与精神。
FC Intro magic text = 将魔法融入军队与城市的发展，探查未知地形、强化部队防御、施展全国仪式。
FC Intro paths text = 农业、工业、航海、文化、宗教与魔法共同构成文明的发展道路。根据疆域、资源和对手选择研究方向，让每次探索与扩张都为下一步铺路。
FC Intro ruins header = 走进遗迹，带回故事
FC Intro ruins lead = 27种遗迹结果、12种选择遭遇，等待你的探险队。
FC Intro ruins text = 踏入荒野，寻找先民留下的知识、钱币、地图与契约。
FC Intro ruins text 2 = 付出代价换取力量，保存记录带回知识，或邀请旅途中的英雄同行。每次遭遇，都由你选择如何回应。
FC Intro city-states header = 和特色城邦结盟
FC Intro city-states lead = 24座城邦，每一座都有自己的特色盟约加成。
FC Intro city-states text = 从农业、工业到科研与军事，选择值得争取的伙伴，让盟友的支持帮助你的文明发展。
FC Intro contribute header = 欢迎贡献
FC Intro contribute text = 欢迎大家贡献游玩反馈、平衡建议、翻译、代码，以及新的文明和故事。你可以通过 Issue 分享发现，也可以通过 Pull Request 参与开发。
FC Intro artists text = 欢迎美术作者参与文明徽记、单位、地形、建筑与英雄形象的创作！
FC Intro repository = github.com/000gamer/FantasyUnciv
FC Civ Mercantile Republic lore = 由议会与契约治理的港口共和国。维系疆域的不是王冠，而是商路与金币。
FC Civ Forest Elves lore = 与古林共生的精灵。他们不轻易砍伐森林，而是从林地中获得信仰与力量。
FC Civ Sea Elves lore = 随潮汐迁徙的海上精灵，能把浅海的礁石筑成新的家园。
FC Civ Mountain Dwarves lore = 守着群峰与炉火的矮人氏族。城墙与矿井，就是他们的骄傲。
FC Civ Artificer Dwarves lore = 把符文刻进齿轮与铁砧的匠师之族，相信精确的手艺能改变世界。
FC Civ Nomadic Orcs lore = 追逐水草与风的兽人氏族。狼与马，就是他们的城墙。
FC Civ Orc Empire lore = 以军团法度统一诸部的兽人帝国。战旗所指之处，便是疆界。
FC Civ Industrial Goblins lore = 在蒸汽与齿轮中忙碌的地精工会。他们相信，任何问题都能用更大的机器解决。
FC Civ Explorers Guild lore = 以测绘合约起家的探险者联盟。地图上的每一块空白，都是一笔生意。
FC Civ Lich Dynasty lore = 由不眠的巫妖学者统治的王朝。对他们而言，死亡只是研究的另一种形式。
FC Civ Bone Empire lore = 由永不解散的骸骨军团组成的帝国。旗帜下的士兵，从不退役。
FC Mod introduction = 模组介绍
FC Recruiting encounters = 招募英雄的遭遇
FC Recruitment common requirements = 以下六种遭遇可以招募英雄：需已拥有城市、当前未拥有该英雄，且遗迹与国家奇观英雄合计少于2位。金币费用列在对应选项中。
FC Reef colonization = 近海导航后可在沿海城市训练造礁开拓者，建立岛礁殖民地。
FC Reef foundation = 每队可造礁1次，造礁不消耗移动力，可在同回合继续建城。选址须为无主、无资源、未改良、无地貌的浅海；可邻接陆地，3格内无城市。之后按正常规则建城。
FC Reef workflow = 抵达合适浅海并保留移动力时，执行“改造地形：岛礁”；造礁不消耗移动力，随后可在同一回合建城并消耗本单位。建城前岛礁仍是无主地块。
