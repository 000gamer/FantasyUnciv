FC Civ Human Empire lore = A human empire bound together by written law. Every building in the capital is a model its provinces follow.
FC Intro title = FantasyUnciv
FC Intro tagline = Build your civilization in a world of magic and steel!
FC Intro version = Version 2.0
FC Intro summary = FantasyUnciv is a complete fantasy ruleset mod for Unciv. Build cities, research technologies, explore ruins, ally with city-states and recruit heroes as you compete to shape the world.
FC Intro realm header = Build a realm of your own
FC Intro realm lead = 8 eras, 6 races and 12 civilizations, each with its own character.
FC Intro realm text = Lead humans, elves, dwarves, orcs, goblins or the undead into a world of magic, and build a realm of your own!
FC Intro sea lead = Sea Elves can even build cities at sea!
FC Intro sea text = Raise islands from suitable shallow water, establish new cities and extend your realm beyond the shoreline.
FC Intro magic header = From spellcraft to magitech
FC Intro magic lead = 80 technologies and 10 policy branches, with magic and industry advancing together.
FC Intro magic text = From magic records to great magic engineering, magic becomes the infrastructure of the state. Armies advance from spears and crossbows to firearms, magitech cannons and constructs; the magic victory is to complete the Gate Beyond and carry your civilization to a new world.
FC Intro paths text = Agriculture, industry, navigation, culture, religion and magic all contribute to your civilization’s development. Choose your research around the land, resources and rivals you encounter, and turn each discovery into an opportunity.
FC Intro ruins header = Find more than treasure
FC Intro ruins lead = 15 ruin outcomes, 4 choice-driven encounters and natural wonders beneath the sea await your expeditions.
FC Intro ruins text = Venture into the wilderness to recover ancient knowledge, coins, maps and relics.
FC Intro ruins text 2 = Pay a price for power or preserve records for knowledge. Decide how to respond to each encounter.
FC Intro city-states header = Ally with distinctive city-states
FC Intro city-states lead = 24 city-states, each with its own distinctive allied bonus.
FC Intro city-states text = From agriculture and industry to research and military support, choose the partners whose strengths will help your civilization grow.
FC Intro contribute header = Contributions welcome
FC Intro contribute text = Contributions are welcome: player feedback, balance suggestions, translations, code, new civilizations and stories. Share your discoveries in an issue or contribute through a pull request.
FC Intro artists text = Artists are welcome to create civilization emblems, units, terrain, buildings and hero designs!
FC Intro repository = github.com/000gamer/FantasyUnciv
FC Civ Mercantile Republic lore = A harbour republic governed by council and contract. Trade routes and gold hold it together, not a crown.
FC Civ Forest Elves lore = Elves who live in harmony with the ancient woods. They rarely fell a forest; they draw faith and strength from it instead.
FC Civ Sea Elves lore = Sea-faring elves who follow the tides and can raise new homes from shallow reefs.
FC Civ Mountain Dwarves lore = Dwarf clans who keep the mountain peaks and their forges. Their walls and mines are their pride.
FC Civ Artificer Dwarves lore = Master artificers who carve runes into gears and anvils, certain that precise craft can change the world.
FC Civ Nomadic Orcs lore = Orc clans who follow the grass and the wind. Their wolves and horses are their walls.
FC Civ Orc Empire lore = An orc empire that united the tribes under legion law. Wherever its banners point, there lies its border.
FC Civ Industrial Goblins lore = A goblin guild busy among steam and gears, convinced that any problem can be solved with a bigger machine.
FC Civ Explorers Guild lore = An alliance of explorers built on surveying contracts. Every blank spot on the map is a business opportunity.
FC Civ Lich Dynasty lore = A dynasty ruled by sleepless lich scholars, for whom death is just another field of study.
FC Civ Bone Empire lore = An empire of bone legions that never disband. The soldiers under its banners never retire.
FC Mod introduction = Introduction
FC Reef colonization = After Offshore Navigation, coastal cities can train Reef Settlers to establish reef colonies.
FC Reef foundation = Can raise one reef without spending movement, then found a city in the same turn. Requires an unowned, resource-free, unimproved, featureless Coast tile, more than 3 tiles from any city. Found a city afterward using the normal rules.
FC Reef workflow = Reach a suitable Coast tile with movement remaining and choose “Transform terrain: Reef Island”. Reef construction spends no movement. You may immediately found a city on the reef in the same turn, consuming this unit. The reef remains unowned until settled.
