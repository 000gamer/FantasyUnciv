There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = This mod has five victory types:\n - Magic Victory: Build the Origin Observation Project and assemble all six Origin Apparatus components in the capital.\n - Cultural Victory: Complete five policy branches and build the Great Chronicle of Civilizations.\n - Domination Victory: Control every major civilization's original capital.\n - Diplomatic Victory: Win the vote after the Assembly of Nations enables diplomatic voting.\n - Time Victory: Have the highest native score at the turn limit.
