Magic victory access = Every civilization may pursue the Magic Victory. Founding a religion is not required. Unassembled components can be intercepted, and this victory must be enabled.
Magic victory assembly = Build six different components: Plane Core, Plane Locator, Spatial Anchor, Flow Guide, Channel Stabilizer and Gate Control Hub. Any city may produce them; carry them to your current capital and assemble them one by one.
Magic victory overview = A Magic Victory requires advanced magic, spatial engineering and plane research. Research Great Magic Engineering and Spatial Engineering, build the Gate Beyond Project in your capital, then produce and assemble the components.
Magic victory won = The Gate Beyond opens onto a living world that exists in its own right. Your entire civilization sets out through it to begin a new history. You have achieved a Magic Victory.
