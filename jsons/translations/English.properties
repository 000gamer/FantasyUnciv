E16 = Watchers Beneath the Oathstone
E16 Paragraph 1 = Location: An old military stone beside a mountain road
E16 Paragraph 2 = People: A solitary watcher
E16 Paragraph 3 = Situation: Rain has almost erased the names on the stone
E16 Paragraph 4 = The watcher wants to preserve the names of the dead. Whispers come from behind the stone; those who listen report seeing figures hidden in the shadows.
E16-A = A Fund the watcher
E16-A Requirements = Requires: at least one city; at least 80 Gold, paid on selection.
E16-B = B Listen to the echoes
E16-B Requirements = Requires: explorer health above 20; not Mirror Detection Team or Silent Mirror Keeper; does not have Mirror-Eye Training, Insight, Seal Detection.
E16-C = C Take a copy of the names
E17 = The Blind Star Mirror
E17 Paragraph 1 = Location: An abandoned hillside observatory
E17 Paragraph 2 = People: Your casters and record keepers
E17 Paragraph 3 = Situation: A broken mirror still reveals things invisible to the eye
E17 Paragraph 4 = A caster could try to use the mirror, though its cracked surface is dangerous. The nearby notes can be studied, or the remaining pieces sold.
E17-A = A Let a caster try it
E17-A Requirements = Requires: an elemental mage or spellcasting hero; explorer health above 25; does not have Mirror-Eye Training.
E17-B = B Study the notes
E17-C = C Sell the fragments
E18 = The Old Root Covenant
E18 Paragraph 1 = Location: An overgrown garden at the forest edge
E18 Paragraph 2 = People: Your healers and scouts
E18 Paragraph 3 = Situation: Living roots still bar the garden gate
E18 Paragraph 4 = Old tablets lie beneath the roots. Examining them is risky. Someone trained in life magic might instead try to care for the roots.
E18-A = A Examine the roots
E18-A Requirements = Requires: explorer health above 20.
E18-B = B Care for the roots
E18-B Requirements = Requires: has Breath of Life; does not have Springwood Covenant; explorer health above 20.
E18-C = C Copy the inscriptions
E19 = The Sunken Bell Chart
E19 Paragraph 1 = Location: A ruined landing near the water
E19 Paragraph 2 = People: Members of your expedition
E19 Paragraph 3 = Situation: A stone box holds a chart of water crossings
E19 Paragraph 4 = The chart marks shallows and dangerous currents. Testing the route could teach the expedition useful skills, at some risk. Copying the chart is safer.
E19-A = A Test the crossing
E19-A Requirements = Requires: explorer health above 20; does not have Amphibious Transport.
E19-B = B Copy the chart
E19-C = C Sell the equipment
E20 = The Lost Courier Register
E20 Paragraph 1 = Location: An abandoned road station
E20 Paragraph 2 = People: Your pathfinders and supply crew
E20 Paragraph 3 = Situation: A register describes ruins, camps and water sources nearby
E20 Paragraph 4 = Some of its road markers remain. Follow a route to check it, or take the register home for study.
E20-A = A Find the marked ruins
E20-B = B Resupply along the markers
E20-B Requirements = Requires: an injured explorer.
E20-C = C Preserve the register
E24 = The Sealed Relic Casket
E24 Paragraph 1 = Location: A collapsed camp
E24 Paragraph 2 = People: The soldiers who found a wooden chest
E24 Paragraph 3 = Situation: The chest contains old equipment, notes and medicine
E24 Paragraph 4 = The equipment can still teach useful techniques, and the notes are worth preserving. Wounded soldiers would rather use the medicine.
E24-A = A Study the equipment
E24-B = B Copy the records
E24-C = C Use the medicine
E24-C Requirements = Requires: an injured explorer.
E25 = The Last Load on Springroad
E25 Paragraph 1 = Location: A woodland path leading to a spring
E25 Paragraph 2 = People: A traveling physician with a medicine chest
E25 Paragraph 3 = Situation: The physician lacks supplies for the road ahead
E25 Paragraph 4 = He is willing to join your expedition if you fund his supplies. Otherwise, you can obtain some medicine or record the shelters along his route.
E25-A = A Invite the physician
E25-A Requirements = Requires: at least one city; fewer than two visiting heroes; Springroad Physician is not already recruited; explorer health above 20; at least 160 Gold, paid on selection.
E25-B = B Use the medicine
E25-B Requirements = Requires: an injured explorer.
E25-C = C Record the shelters
E26 = A Voluntary Soul Covenant
