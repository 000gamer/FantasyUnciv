Magic victory access = Every civilization may pursue a Magic Victory. Founding a religion or training particular spellcasters is not required. Unassembled components can be intercepted, and this victory must be enabled.
Magic victory assembly = Build three Resonance Anchors and one Stellar Matrix, Stabilization Core and Material Calibrator: six components in total. Different cities may produce them; bring them to the current capital and assemble them individually.
Magic victory overview = A Magic Victory requires knowledge of the four sources and completion of the Origin Apparatus. Research the relevant technologies, build the Origin Observation Project, then produce and assemble its components.
Magic victory won = Your civilization has mastered the four sources and completed the Origin Apparatus in its capital. You have achieved a Magic Victory.
