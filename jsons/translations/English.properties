E26 Paragraph 2 = People: An armored specter
E26 Paragraph 3 = Situation: The specter watches over a list of fallen soldiers
E26 Paragraph 4 = He asks you to take the names somewhere safe. With shelter and supplies arranged, he is willing to join your army.
E26-A = A Invite the Oathstone Walker
E26-A Requirements = Requires: at least one city; fewer than two visiting heroes; Monument Oathwalker is not already recruited; at least 240 Gold, paid on selection.
E26-B = B Preserve the names
E27 = The Molten Seal Envoy
