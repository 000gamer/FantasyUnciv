FC Heroes = Heroes
FC Heroes overview = Browse all twelve heroes. Select a name to open that hero’s Civilopedia entry.
FC Introduction choices = Choose technologies and policies suited to your civilization and terrain. Develop agriculture, industry, navigation, culture, religion and four schools of magic, and recruit heroes to support your armies.
FC Introduction setting = FantasyUnciv is a standalone fantasy civilization ruleset. Twelve civilizations develop their realms, explore the wilderness and compete across six eras.
FC Introduction victories = Pursue Magic, Cultural, Domination, Diplomatic or Time Victory. Era I and Standard speed are recommended for a first game.
FC Mod introduction = Introduction
FC Recruiting encounters = Hero recruitment encounters
FC Recruitment common requirements = The next six encounters can recruit heroes. You must own a city, not already own that hero, and have fewer than two heroes from ruins and national wonders combined. Gold costs are shown with each option.
FC Reef colonization = After Ocean Navigation, coastal cities can train Reef Settlers to establish reef colonies.
FC Reef foundation = Can raise one reef without spending movement, then found a city in the same turn. Requires an unowned, resource-free, unimproved, featureless Coast tile, more than 3 tiles from any city. Found a city afterward using the normal rules.
FC Reef workflow = Reach a suitable Coast tile with movement remaining and choose “Transform terrain: Reef Island”. Reef construction spends no movement. You may immediately found a city on the reef in the same turn, consuming this unit. The reef remains unowned until settled.
